[workspace]
members = [".", "macros"]
# 对比基准依赖 V8 等大库，自成 workspace
exclude = ["benches"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/0x00-Community/paragc"

[workspace.dependencies]
paragc-macros = { version = "0.1.0", path = "macros" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
# 块与对象头的对齐由布局保证（块按 32 KiB 对齐、对象按 8 字节粒度）
cast_ptr_alignment = "allow"

[package]
name = "paragc"
description = "A parallel mark-region (Immix-style blocks and lines) garbage collector for Rust: non-moving, lock-free allocation from many threads, parallel marking with work stealing and parallel sweeping"
readme = "README.md"
repository.workspace = true
keywords = ["gc", "garbage-collector", "immix", "parallel"]
categories = ["memory-management"]
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
paragc-macros.workspace = true
j8lockfree = "0.1.2"
crossbeam-deque = "0.8.8"
crossbeam-utils = "0.8.23"

[lints]
workspace = true
