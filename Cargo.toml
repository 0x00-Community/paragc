[workspace]
members = [".", "macros"]
# The comparison benchmarks depend on large libraries such as V8, so they are a workspace of their own
exclude = ["benches"]

[workspace.package]
version = "0.7.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/0x00-Community/paragc"

[workspace.dependencies]
paragc-macros = { version = "0.7.1", path = "macros" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
# Block and header alignment is guaranteed by the layout (blocks aligned to 32 KiB, objects to the 8-byte granule)
cast_ptr_alignment = "allow"

[package]
name = "paragc"
description = "A parallel mark-region (Immix-style blocks and lines) garbage collector for Rust: lock-free allocation from many threads, parallel marking with work stealing, parallel sweeping, young collections that compact survivors, reference counting and defragmenting evacuation"
readme = "README.md"
repository.workspace = true
keywords = ["gc", "garbage-collector", "immix", "parallel"]
categories = ["memory-management"]
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Cross-heap (public heaps on shared memory, sharing across processes): Linux only; on other platforms the feature compiles to nothing
crossheap = []

[package.metadata.docs.rs]
features = ["crossheap"]

[dependencies]
paragc-macros.workspace = true
crossbeam-deque = "0.8.8"
crossbeam-utils = "0.8.23"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.180"

[lints]
workspace = true
