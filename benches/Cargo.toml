# Comparison benchmarks of paragc against cppgc (V8 Oilpan) / gc-arena / gc (rust-gc) / dumpster.
# V8's prebuilt library is large, so this is a workspace of its own outside paragc's build. See run.sh for how to run them.
[workspace]
members = ["common", "paragc", "paragc-public", "cppgc", "gc-arena", "rust-gc", "dumpster"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
bench-common = { path = "common" }

[profile.release]
debug = false
